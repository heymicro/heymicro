<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Help shape Micro. Tell us what would make it useful in your daily life.">
  <title>Send feedback — Hey Micro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><a href="/">Hey Micro 👋</a></header>
    <h1>Help shape Micro.</h1>
    <p class="lead">Tell us what would make Micro useful in your daily life, or what gets in your way.</p>
    <form method="post" action="https://micro.mu/forms/submit?id=3a1264bb-ef86-44e9-8a0d-41e8353333a3">
      <label>Email (optional)
        <input type="email" name="email" autocomplete="email" maxlength="1000" aria-describedby="email-hint">
      </label>
      <p class="hint" id="email-hint">Leave your email if you would like a reply.</p>
      <label>Message
        <textarea name="message" rows="6" maxlength="8000" required></textarea>
      </label>
      <p class="hint">Your feedback is sent privately to Micro. No account is required.</p>
      <button class="button" type="submit">Send feedback</button>
    </form>
    <footer>
      Developed and operated by Micro XYZ LTD.
      <div class="actions">
        <a href="/">Back to Hey Micro</a>
        <a href="/privacy">Privacy</a>
      </div>
    </footer>
  </main>
</body>
</html>
